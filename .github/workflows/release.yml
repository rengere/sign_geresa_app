name: Publicar versión

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que el tag coincide con pubspec.yaml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $linea = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          $version = $linea.Matches[0].Groups[1].Value.Split('+')[0]
          if ($tag -ne $version) {
            Write-Error "El tag ($tag) no coincide con la version de pubspec.yaml ($version)"
            exit 1
          }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 'PON_AQUI_TU_VERSION'
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath firmador-windows.zip

      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" firmador-windows.zip --generate-notes